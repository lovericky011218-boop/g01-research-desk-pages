<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>研究工作台 · 解锁</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#302f2d;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{max-width:420px;width:100%;background:#fff;border:1px solid #e6e5e0;border-radius:10px;padding:38px;box-shadow:0 8px 32px #00000004}small{color:#918b80;font-size:10px;letter-spacing:2px}h1{font-size:26px;font-weight:650;margin:10px 0}p{color:#858078;font-size:13px;margin-bottom:24px}label{display:block;font-size:13px;margin-bottom:8px}input{font:inherit;width:100%;border:1px solid #d9d7d0;border-radius:5px;padding:11px;background:#fff;color:#302f2d}input:focus{outline:2px solid #90adc5;outline-offset:1px}button{font:inherit;width:100%;background:#363632;color:#fff;border:0;border-radius:5px;padding:11px;margin-top:15px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}[role=status]{font-size:12px;color:#936755;min-height:24px;margin:12px 0 0}footer{font-size:11px;color:#aaa49a;margin-top:20px}</style></head>
<body><main><small>PRIVATE RESEARCH WORKSPACE</small><h1>打开研究工作台</h1><p>项目资料和个人记录已加密。请输入访问口令。</p><form><label for="code">访问口令</label><input id="code" type="password" required autocomplete="off" spellcheck="false" autofocus><button type="submit">解锁工作台</button><div role="status" aria-live="polite"></div></form><footer>请妥善保存访问口令。每次打开页面都需要解锁。</footer></main><script src="./unlock.js"></script></body></html>
